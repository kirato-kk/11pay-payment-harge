<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElevenPay-Payment-Charge</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f6f9; margin: 0; }
    .container { max-width: 440px; margin: 0 auto; }
    
    .card { background: white; padding: 35px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 10px; }
    h1 { font-size: 24px; margin-top: 0; margin-bottom: 25px; font-weight: bold; }
    
    /* モード選択 */
    .mode-btn-group { display: flex; gap: 10px; margin-bottom: 20px; }
    .mode-btn { flex: 1; padding: 20px 10px; border: 2px solid #ddd; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; background: white; }
    .mode-btn.active { border-color: #ff0033; background: #fff0f2; color: #ff0033; }
    
    /* 入力画面 */
    label { display: block; font-size: 16px; color: #333; margin-bottom: 12px; font-weight: bold; }
    input { width: 100%; padding: 16px; font-size: 28px; border: 2px solid #ddd; border-radius: 12px; text-align: center; font-weight: bold; }
    .main-btn { width: 100%; padding: 18px; font-size: 20px; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; margin-top: 20px; }
    
    /* 確認画面 */
    #confirm-view { display: none; }
    .confirm-text { font-size: 18px; color: #333; font-weight: bold; margin-bottom: 10px; }
    .confirm-amount { font-size: 40px; font-weight: bold; margin: 15px 0 25px 0; }
    .confirm-btn-group { display: flex; gap: 10px; }
    .cancel-btn { flex: 1; padding: 16px; background: #6c757d; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; }
    .ok-btn { flex: 1.5; padding: 16px; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; }

    /* QR表示画面 */
    #qr-view { display: none; }
    #qrcode { margin: 25px auto; display: flex; justify-content: center; }
    .qr-badge { font-size: 24px; font-weight: bold; margin-bottom: 20px; }
    .reset-btn { width: 100%; padding: 16px; background: #6c757d; color: white; border: none; border-radius: 12px; font-weight: bold; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>

<div class="container">
  <div class="card" id="main-card">
    <h1 id="main-title">お会計・チャージ</h1>

    <!-- 1. 入力画面 -->
    <div id="input-view">
      <div class="mode-btn-group">
        <button class="mode-btn active" id="btn-pay" onclick="setMode('PAY')">お支払い</button>
        <button class="mode-btn" id="btn-charge" onclick="setMode('CHARGE')">チャージ</button>
      </div>
      <label id="input-label">お支払い金額を入力</label>
      <input type="number" id="pay-amount" placeholder="金額を入力">
      <button class="main-btn" id="next-btn" onclick="askConfirmation()" style="background:#ff0033;">次へ進む</button>
    </div>

    <!-- 2. 確認画面 -->
    <div id="confirm-view">
      <div class="confirm-text" id="confirm-label">こちらの金額でお会計しますか？</div>
      <div class="confirm-amount" id="display-confirm-amount" style="color:#ff0033;">0円</div>
      <div class="confirm-btn-group">
        <button class="cancel-btn" onclick="resetToInput()">戻る</button>
        <button class="ok-btn" id="ok-btn" onclick="generateQR()" style="background:#ff0033;">はい</button>
      </div>
    </div>

    <!-- 3. QR表示画面 -->
    <div id="qr-view">
      <div class="qr-badge" id="qr-status" style="color:#ff0033;"></div>
      <div id="qrcode"></div>
      <button class="reset-btn" onclick="resetToInput()">最初に戻る</button>
    </div>

  </div>
</div>

<script>
  let currentMode = 'PAY';
  let tempAmount = 0;

  function setMode(mode) {
    currentMode = mode;
    document.getElementById('btn-pay').classList.toggle('active', mode === 'PAY');
    document.getElementById('btn-charge').classList.toggle('active', mode === 'CHARGE');
    
    // 色とテキストの切り替え
    const color = (mode === 'PAY') ? '#ff0033' : '#007bff';
    document.getElementById('main-title').innerText = (mode === 'PAY') ? 'お会計' : 'チャージ';
    document.getElementById('input-label').innerText = (mode === 'PAY') ? 'お支払い金額を入力' : 'チャージ金額を入力';
    document.getElementById('next-btn').style.backgroundColor = color;
    document.getElementById('ok-btn').style.backgroundColor = color;
    document.getElementById('display-confirm-amount').style.color = color;
    document.getElementById('qr-status').style.color = color;
  }

  function askConfirmation() {
    let amount = parseInt(document.getElementById("pay-amount").value);
    if (!amount || amount <= 0) {
      alert("金額を入力してください！");
      return;
    }
    
    // チャージの時は1000円単位チェックを入れる場合
    if (currentMode === 'CHARGE' && amount % 1000 !== 0) {
      alert("チャージは1,000円単位で入力してください");
      return;
    }

    tempAmount = amount;
    document.getElementById("confirm-label").innerText = (currentMode === 'PAY') ? "こちらの金額でお会計しますか？" : "こちらの金額でチャージしますか？";
    document.getElementById("display-confirm-amount").innerText = `${amount.toLocaleString()} 円`;
    
    document.getElementById("input-view").style.display = "none";
    document.getElementById("confirm-view").style.display = "block";
  }

  function generateQR() {
    let qrContainer = document.getElementById("qrcode");
    qrContainer.innerHTML = ""; 

    // データの種類を PAY_ または CHARGE_ で分ける
    let qrText = (currentMode === 'PAY' ? "PAY_" : "CHARGE_") + tempAmount;

    new QRCode(qrContainer, {
      text: qrText,
      width: 220,
      height: 220
    });

    document.getElementById("qr-status").innerText = (currentMode === 'PAY') ? `お支払い額: ${tempAmount.toLocaleString()}円` : `チャージ額: ${tempAmount.toLocaleString()}円`;
    
    document.getElementById("confirm-view").style.display = "none";
    document.getElementById("qr-view").style.display = "block";
  }

  function resetToInput() {
    document.getElementById("pay-amount").value = "";
    document.getElementById("qrcode").innerHTML = "";
    document.getElementById("confirm-view").style.display = "none";
    document.getElementById("qr-view").style.display = "none";
    document.getElementById("input-view").style.display = "block";
  }
</script>

</body>
</html>
