<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElevenPay-Paymant-Charge</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f6f9; margin: 0; }
    .container { max-width: 440px; margin: 0 auto; }
    .card { background: white; padding: 35px 20px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 10px; }
    h1, h2, h3 { color: #333; margin-top: 0; }
    
    .main-btn { width: 100%; padding: 18px; font-size: 18px; color: white; border: none; border-radius: 12px; cursor: pointer; font-weight: bold; background: #007bff; margin-top: 15px; }
    .pay-btn { background: #ff0033; }
    .charge-btn { background: #007bff; }
    .secondary-btn { width: 100%; padding: 14px; font-size: 16px; color: #333; border: 1px solid #ccc; border-radius: 12px; cursor: pointer; font-weight: bold; background: #f8f9fa; margin-top: 10px; }
    
    input, select { width: 100%; padding: 14px; font-size: 24px; border: 2px solid #ddd; border-radius: 12px; text-align: center; font-weight: bold; margin-top: 15px; box-sizing: border-box; }
    select { font-size: 16px; text-align: center; }
    .hidden { display: none; }
    
    .spinner { width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #007bff; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .pop-anim { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
    @keyframes popIn { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    
    <!-- 1. トップ画面（始めるボタンのみ） -->
    <div id="start-view">
      <h1>お会計・チャージ</h1>
      <button class="main-btn" onclick="openPassScreen()" style="font-size: 22px; padding: 22px;">始める</button>
    </div>

    <!-- 2. パスワード確認画面 -->
    <div id="pass-view" class="hidden">
      <h3>パスワード</h3>
      <p style="color: #666; font-size: 14px;">4桁の暗証番号を入力してください</p>
      <input type="password" id="pass-input" placeholder="" maxlength="4">
      <button class="main-btn" onclick="verifyPassword()">確認</button>
      <button class="secondary-btn" onclick="resetToStart()">戻る</button>
    </div>

    <!-- 3. モード選択画面（お会計 / チャージ） -->
    <div id="mode-view" class="hidden">
      <h2>モード選択</h2>
      <button class="main-btn pay-btn" onclick="selectMode('PAY')">お会計</button>
      <button class="main-btn charge-btn" onclick="selectMode('CHARGE')">チャージ</button>
      <button class="secondary-btn" onclick="resetToStart()">戻る</button>
    </div>

    <!-- 4. 店舗選択画面（お会計モード選択時のみ通過） -->
    <div id="shop-select-view" class="hidden">
      <h3>🏪 店舗の選択</h3>
      <p style="font-size: 13px; color: #666; margin-bottom: 10px;">利用する店舗を選択または登録してください</p>

      <select id="shop-dropdown" style="padding: 10px; margin-top: 5px;">
        <option value="">選択なし (個人利用)</option>
      </select>

      <div style="margin: 15px 0 10px 0; display: flex; gap: 5px;">
        <input type="text" id="new-shop-input" placeholder="新しい店舗名を入力" style="flex: 1; padding: 10px; font-size: 14px; margin-top: 0;">
        <button onclick="registerNewShop()" style="padding: 10px 14px; font-size: 14px; background: #28a745; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold;">登録</button>
      </div>

      <button class="main-btn" onclick="confirmShopSelection()">決定して進む</button>
      <button class="secondary-btn" onclick="backToModeSelect()">戻る</button>
    </div>

    <!-- 5. 金額入力画面（手入力のみ） -->
    <div id="input-view" class="hidden">
      <h2 id="mode-title">金額設定</h2>
      <div id="selected-shop-label" style="font-size: 14px; color: #007bff; font-weight: bold;"></div>
      <input type="number" id="custom-amount" placeholder="金額を入力 (円)">
      <button class="main-btn" onclick="submitAmount()">確定</button>
      <button class="secondary-btn" onclick="backFromInput()">戻る</button>
    </div>

    <!-- 6. 処理中... -->
    <div id="processing-view" class="hidden">
      <div class="spinner"></div>
      <div style="font-size: 20px; font-weight: bold;">処理中...</div>
    </div>

    <!-- 7. QRコード表示 -->
    <div id="qr-view" class="hidden">
      <h3 id="qr-label" style="color: #007bff;"></h3>
      <div id="qrcode" class="pop-anim" style="margin: 20px auto; display: flex; justify-content: center;"></div>
      <p style="color: #666; font-size: 14px;">スマホアプリで読み取ってください</p>
      <button class="secondary-btn" onclick="backToModeSelect()">完了</button>
    </div>

  </div>
</div>

<script>
  const CORRECT_PASS = "4869"; // 暗証番号
  let currentMode = ""; 
  let tempAmount = 0;
  let selectedShopName = ""; // 選択された店舗名

  // --- 初期化 ＆ 店舗リスト読み込み ---
  function loadShopList() {
    const savedShops = JSON.parse(localStorage.getItem('11pay_shops') || '["セブンイレブン", "ローソン", "ファミリーマート"]');
    const dropdown = document.getElementById("shop-dropdown");
    dropdown.innerHTML = '<option value="">選択なし (個人利用)</option>';
    
    savedShops.forEach(shop => {
      const opt = document.createElement("option");
      opt.value = shop;
      opt.innerText = shop;
      dropdown.appendChild(opt);
    });
  }

  // パスワード入力画面へ
  function openPassScreen() {
    document.getElementById("start-view").classList.add("hidden");
    document.getElementById("pass-view").classList.remove("hidden");
    document.getElementById("pass-input").value = "";
  }

  // パスワード照合 ➔ モード選択へ
  function verifyPassword() {
    const input = document.getElementById("pass-input").value;
    if (input === CORRECT_PASS) {
      document.getElementById("pass-view").classList.add("hidden");
      document.getElementById("mode-view").classList.remove("hidden");
    } else {
      alert("パスワードが違います");
      document.getElementById("pass-input").value = "";
    }
  }

  // モード選択（PAY / CHARGE）
  function selectMode(mode) {
    currentMode = mode;
    selectedShopName = ""; // 店舗選択のリセット
    
    document.getElementById("mode-view").classList.add("hidden");

    if (currentMode === "PAY") {
      // お会計時 ➔ 店舗選択画面を表示
      loadShopList();
      document.getElementById("shop-select-view").classList.remove("hidden");
    } else {
      // チャージ時 ➔ 店舗選択はスキップして金額入力へ
      openInputView();
    }
  }

  // 新しい店舗の登録
  function registerNewShop() {
    const newShop = document.getElementById("new-shop-input").value.trim();
    if (!newShop) return alert("店舗名を入力してください");

    let savedShops = JSON.parse(localStorage.getItem('11pay_shops') || '["セブンイレブン", "ローソン", "ファミリーマート"]');
    if (!savedShops.includes(newShop)) {
      savedShops.push(newShop);
      localStorage.setItem('11pay_shops', JSON.stringify(savedShops));
    }
    
    document.getElementById("new-shop-input").value = "";
    loadShopList();
    document.getElementById("shop-dropdown").value = newShop;
  }

  // 店舗選択を確定して金額入力画面へ
  function confirmShopSelection() {
    selectedShopName = document.getElementById("shop-dropdown").value;
    document.getElementById("shop-select-view").classList.add("hidden");
    openInputView();
  }

  // 金額入力画面を開く共通処理
  function openInputView() {
    document.getElementById("custom-amount").value = "";
    document.getElementById("input-view").classList.remove("hidden");
    
    const modeTitle = currentMode === "PAY" ? "お会計" : "チャージ";
    document.getElementById("mode-title").innerText = modeTitle;

    const shopLabel = document.getElementById("selected-shop-label");
    if (currentMode === "PAY" && selectedShopName) {
      shopLabel.innerText = `店舗: ${selectedShopName}`;
      shopLabel.classList.remove("hidden");
    } else {
      shopLabel.innerText = "";
      shopLabel.classList.add("hidden");
    }
  }

  // 金額決定 ➔ 処理中画面へ
  function submitAmount() {
    const inputVal = document.getElementById("custom-amount").value;
    tempAmount = parseInt(inputVal);
    if (!tempAmount || tempAmount <= 0) return alert("金額を入力してください");

    startProcessing();
  }

  function startProcessing() {
    document.getElementById("input-view").classList.add("hidden");
    document.getElementById("processing-view").classList.remove("hidden");

    setTimeout(() => {
      document.getElementById("processing-view").classList.add("hidden");
      document.getElementById("qr-view").classList.remove("hidden");

      // 表示用テキストの生成
      let labelText = "";
      if (currentMode === "PAY") {
        labelText = selectedShopName ? `お支払い (${selectedShopName}): ${tempAmount.toLocaleString()}円` : `お支払い: ${tempAmount.toLocaleString()}円`;
      } else {
        labelText = `チャージ: ${tempAmount.toLocaleString()}円`;
      }
      document.getElementById("qr-label").innerText = labelText;

      // QR埋め込み文字列の組み立て
      let qrData = "";
      if (currentMode === "PAY") {
        // 店舗選択がある場合は PAY_金額_店舗名、選択なしの場合は PAY_金額
        qrData = selectedShopName ? `PAY_${tempAmount}_${selectedShopName}` : `PAY_${tempAmount}`;
      } else {
        // チャージ時は常に CHARGE_金額
        qrData = `CHARGE_${tempAmount}`;
      }

      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";
      
      qrContainer.classList.remove('pop-anim');
      void qrContainer.offsetWidth; 
      qrContainer.classList.add('pop-anim');

      new QRCode(qrContainer, {
        text: qrData,
        width: 200,
        height: 200
      });
    }, 1500);
  }

  // 金額入力画面からの「戻る」ボタンの挙動
  function backFromInput() {
    document.getElementById("input-view").classList.add("hidden");
    if (currentMode === "PAY") {
      document.getElementById("shop-select-view").classList.remove("hidden");
    } else {
      document.getElementById("mode-view").classList.remove("hidden");
    }
  }

  // 機能を選択画面（mode-view）に戻る処理
  function backToModeSelect() {
    tempAmount = 0;
    currentMode = "";
    selectedShopName = "";
    document.getElementById("custom-amount").value = "";
    document.getElementById("shop-select-view").classList.add("hidden");
    document.getElementById("input-view").classList.add("hidden");
    document.getElementById("processing-view").classList.add("hidden");
    document.getElementById("qr-view").classList.add("hidden");
    document.getElementById("mode-view").classList.remove("hidden");
  }

  // 完全な初期状態（スタート画面）に戻る処理
  function resetToStart() {
    tempAmount = 0;
    currentMode = "";
    selectedShopName = "";
    document.getElementById("custom-amount").value = "";
    document.getElementById("start-view").classList.remove("hidden");
    document.getElementById("pass-view").classList.add("hidden");
    document.getElementById("shop-select-view").classList.add("hidden");
    document.getElementById("mode-view").classList.add("hidden");
    document.getElementById("input-view").classList.add("hidden");
    document.getElementById("processing-view").classList.add("hidden");
    document.getElementById("qr-view").classList.add("hidden");
  }
</script>

</body>
</html>
